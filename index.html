<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <script>
    // App tecnico e app gestione: due icone separate sulla schermata Home
    (function () {
      var tec = location.pathname.indexOf('/t') === 0;
      var l = document.createElement('link'); l.rel = 'manifest';
      l.href = tec ? '/manifest-tecnico.webmanifest' : '/manifest-gestione.webmanifest';
      document.head.appendChild(l);
      var m = document.createElement('meta'); m.name = 'apple-mobile-web-app-title'; m.content = tec ? 'Flotta' : 'Gestione flotta';
      document.head.appendChild(m);
    })();
  </script>
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <meta name="robots" content="noindex">
  <title>Gestione flotta · Molajoni</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
